<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bat Ball Stump Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>This is a Bat Ball Stump Game in JS.</h2>
    <hr>

    <button onclick="playGame('Bat')">Bat</button>
    <button onclick="playGame('Ball')">Ball</button>
    <button onclick="playGame('Stump')">Stump</button>

    <script>

        function playGame(userChoice) {

            // Generate random number between 0 and 3
            let randomNumber = Math.random() * 3;
            let computerChoice;
            // here we defined thse as the local variable and only used within the function.

            // Decide computer choice
            if (randomNumber <= 1) {
                computerChoice = 'Bat';
            }
            else if (randomNumber <= 2) {
                computerChoice = 'Ball';
            }
            else {
                computerChoice = 'Stump';
            }

            let resultMessage;

            // Decide winner
            if (userChoice === computerChoice) {
                resultMessage = "It's a Tie!";
            }
            else if (
                (userChoice === 'Bat' && computerChoice === 'Ball') ||
                (userChoice === 'Ball' && computerChoice === 'Stump') ||
                (userChoice === 'Stump' && computerChoice === 'Bat')
            ) {
                resultMessage = "You Win!";
            }
            else {
                resultMessage = "Computer Wins!";
            }

            // Show result
            alert(
                `You chose ${userChoice}.Computer chose ${computerChoice}.${resultMessage}`
            );
        }

    </script>

</body>
</html>
